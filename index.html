<!doctype html>
<html lang="no">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Solsystemet vårt</title>
        <!-- Andika er laget for barn som lærer å lese. Fredoka er rund og leken til overskrifter. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap"
        />
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
        <header class="topp">
            <h1>🚀 <span class="regnbue">Solsystemet</span></h1>
            <div id="dato"></div>
            <p class="hint">
                Trykk på en planet for å fly dit!
            </p>
        </header>

        <!-- Dukker opp når det er formørkelse -->
        <div id="hendelse" role="status" aria-live="polite"></div>

        <aside id="info">
            <button id="lukk" title="Lukk" aria-label="Lukk">✕</button>
            <div id="info-type"></div>
            <h2 id="info-navn"></h2>
            <div id="info-kallenavn"></div>
            <dl id="info-levende" hidden></dl>
            <dl id="info-stats"></dl>
            <h3>🤩 Visste du at …</h3>
            <ul id="info-fakta"></ul>
            <button id="tilbake">🚀 Fly tilbake</button>
        </aside>

        <footer class="bunn">
            <nav id="nav"></nav>
            <div class="kontroller" id="kontroller">
                <button id="pause" title="Pause">⏸️</button>
                <div class="fart">
                    <span class="fart-ikon" aria-hidden="true">🐢</span>
                    <input
                        id="fart"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        aria-label="Fart"
                    />
                    <span class="fart-ikon" aria-hidden="true">🐇</span>
                    <span id="fart-tekst"></span>
                </div>
                <button id="idag">📅 I dag</button>
                <button id="neste-formorkelse">🌘 Neste formørkelse</button>
                <button id="sta-pa-jorden">🔭 Stå på Jorden</button>
                <button
                    id="apne-innstillinger"
                    title="Innstillinger"
                    aria-label="Innstillinger"
                >
                    ⚙️
                </button>
            </div>
            <!-- Bare på mobil: to knapper som åpner menyene over -->
            <div class="mobil-linje">
                <button
                    id="meny-planeter"
                    aria-controls="nav"
                    aria-expanded="false"
                >
                    <span id="meny-planeter-tekst">🪐 Planeter</span>
                    <span class="pil" aria-hidden="true">▾</span>
                </button>
                <button
                    id="meny-kontroller"
                    aria-controls="kontroller"
                    aria-expanded="false"
                >
                    ⏱️ Tid og mer <span class="pil" aria-hidden="true">▾</span>
                </button>
            </div>
        </footer>

        <!-- Innstillinger: åpnes med tannhjulet -->
        <div id="teppe"></div>
        <aside
            id="innstillinger"
            role="dialog"
            aria-modal="true"
            aria-labelledby="innstillinger-tittel"
        >
            <button id="lukk-innstillinger" title="Lukk" aria-label="Lukk">✕</button>
            <h2 id="innstillinger-tittel">⚙️ Innstillinger</h2>
            <div id="innstillinger-innhold"></div>
        </aside>

        <!-- Korte beskjeder, f.eks. "Jupiter er under bakken nå" -->
        <div id="beskjed" role="status" aria-live="polite"></div>
        <!-- Svart teppe som toner inn og ut når vi bytter mellom rommet og bakken -->
        <div id="overgang"></div>

        <script type="module" src="/main.js"></script>
    </body>
</html>
